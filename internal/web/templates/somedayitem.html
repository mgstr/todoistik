{{template "top" .}}
{{$it := .Data}}
<div class="item">
  {{/* the age hides with every other age (^t): the view it names does not, so
       the crumb still says where this is. */}}
  <p class="crumb"><a href="/someday">Someday/Maybe</a><span class="agetext"> · captured {{age $it.CreatedAt}}</span></p>
  <form method="post" action="/somedayitem/{{$it.ID}}" class="stack">
    <label>Text <textarea name="text" rows="3">{{$it.Text}}</textarea></label>
    <label>Snooze until <input type="date" name="snooze" value="{{$it.SnoozeUntil}}"></label>
    <button class="primary">Save</button>
  </form>
  <div class="actionsbar">
    <a class="button" href="/process?src=someday&item={{$it.ID}}">Move on it — process</a>
    <form method="post" action="/somedayitem/{{$it.ID}}/trash" class="inline"><button class="danger">Trash</button></form>
  </div>
</div>
{{template "bottom" .}}
