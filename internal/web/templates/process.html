{{template "top" .}}
{{$d := .Data}}{{$q := ""}}{{if $d.One}}{{$q = "?one=1"}}{{end}}
<div class="process" data-cancel="{{if eq $d.Src "someday"}}/someday{{else}}/inbox{{end}}">
  <div class="subject">
    <h1 class="capture-text">{{$d.Text}}</h1>
    <p class="cap">captured {{age $d.CreatedAt}}</p>
  </div>

  <div class="branches">
    <form method="post" action="/process/{{$d.Src}}/{{$d.ID}}/trash{{$q}}" class="inline">
      <button>Trash</button>
    </form>
    <form method="post" action="/process/{{$d.Src}}/{{$d.ID}}/reference{{$q}}" class="inline">
      <button title="not actionable, kept outside the app">Reference material</button>
    </form>
    <form method="post" action="/process/{{$d.Src}}/{{$d.ID}}/twominute{{$q}}" class="inline">
      <button title="under two minutes: do it now, record it done">Two-minute rule — done</button>
    </form>
  </div>

  <div class="branches">
    {{if eq $d.Src "someday"}}
    <form method="post" action="/process/{{$d.Src}}/{{$d.ID}}/keep{{$q}}" class="inline">
      <input type="date" name="snooze" title="snooze until">
      <button>Keep incubating</button>
    </form>
    {{else}}
    <form method="post" action="/process/{{$d.Src}}/{{$d.ID}}/someday{{$q}}" class="inline">
      <input type="hidden" name="text" value="{{$d.Text}}">
      <button title="worth looking at some time, but not now">Someday/Maybe</button>
    </form>
    {{end}}
  </div>

  <div class="branches">
    <span class="muted">…</span>
  </div>
</div>
{{template "bottom" .}}
