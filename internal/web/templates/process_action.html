{{template "top" .}}
{{$d := .Data}}
<div class="process" data-cancel="{{$d.Back}}">
  <div class="subject">
    <h1 class="capture-text">{{$d.Text}}</h1>
    <p class="cap">captured {{age $d.CreatedAt}}</p>
  </div>

  {{if $d.Note}}<p class="ask">{{$d.Note}}</p>{{end}}

  <form method="post" action="/process/{{$d.Src}}/{{$d.ID}}/action{{$d.Q}}" class="stack">
    <label>Title <input name="title" value="{{$d.Vals.Get "title"}}" required autofocus
      placeholder="Starts with a verb, fully self-descriptive"></label>

    <label>Project
      <div class="picker" data-picker>
        <input type="hidden" name="projectid" value="">
        <input type="hidden" name="newproject" value="">
        <input type="hidden" name="newdod" value="">
        <input class="pickerbox" readonly autocomplete="off" spellcheck="false" value="&lt;standalone&gt;">
        <ul class="pickerlist" hidden>
          <li class="pickrow" data-pick="" data-title="standalone">&lt;standalone&gt;</li>
          {{range $d.Picker}}
          <li class="pickrow" data-pick="{{.ID}}" data-title="{{.Title}}">
            <span class="title">{{.Title}}</span>
            {{if .Stalled}}<span class="badge error">stalled</span>{{end}}
            {{if .Open}}<span class="badge">{{.Open}} open</span>{{end}}
          </li>
          {{end}}
          <li class="pickrow pnew" data-pick="new" data-title="">+ new project…</li>
        </ul>
      </div>
    </label>

    <label>Description <textarea name="description" rows="5" spellcheck="false"
      placeholder="Anything worth keeping with it — and everything else this action carries.">{{$d.Vals.Get "description"}}</textarea></label>

    {{template "notation" $d}}

    <div class="branches">
      <button class="primary">Create action</button>
      <a class="button" href="{{$d.Back}}">Back</a>
    </div>
  </form>
</div>

<dialog id="newproject-dialog" aria-labelledby="np-title-label">
  <h2 id="np-title-label">New project</h2>
  <div class="stack">
    <label>Title <input id="np-title" autocomplete="off"></label>
    <label>Definition of done <textarea id="np-dod" rows="2"
      placeholder="How you will know it is done"></textarea></label>
    <p class="muted">It is created together with this action, which becomes its first.</p>
    <div class="branches">
      <button type="button" id="np-ok" class="primary" hidden>Create</button>
      <button type="button" id="np-cancel">Cancel</button>
    </div>
  </div>
</dialog>
{{template "bottom" .}}
