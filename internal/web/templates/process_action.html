{{template "top" .}}
{{$d := .Data}}
<div class="process" data-cancel="{{$d.Back}}">
  <div class="subject">
    <h1 class="capture-text">{{$d.Text}}</h1>
    <p class="cap">captured {{age $d.CreatedAt}}</p>
  </div>

  <datalist id="ctxlist">{{range $d.Contexts}}<option value="@{{.}}">{{end}}</datalist>

  {{if $d.Note}}<p class="ask">{{$d.Note}}</p>{{end}}

  <form method="post" action="/process/{{$d.Src}}/{{$d.ID}}/action{{$d.Q}}" class="stack">
    <div class="who">
      <span class="lbl">Who</span>
      <input type="radio" name="who" id="who-me" value="me" {{if ne ($d.Vals.Get "who") "them"}}checked{{end}}>
      <label class="seg" for="who-me">I do it</label>
      <input type="radio" name="who" id="who-them" value="them" {{if eq ($d.Vals.Get "who") "them"}}checked{{end}}>
      <label class="seg" for="who-them">Someone else</label>
      <input class="whobox" name="assigned" value="{{$d.Vals.Get "assigned"}}" placeholder="who or what">
    </div>

    <label>Title <input name="title" value="{{$d.Vals.Get "title"}}" required autofocus
      placeholder="Starts with a verb, fully self-descriptive"></label>

    <label>Project <input name="project" value="{{$d.Vals.Get "project"}}"
      placeholder="empty — a standalone action"
      data-kb-into
      hx-get="/process/projects" hx-trigger="keyup changed delay:200ms"
      hx-target="#projcands" hx-swap="outerHTML"></label>
    {{template "projectcands" $d.Cands}}

    {{if $d.NeedDOD}}
    <label>Definition of done <textarea name="dod" rows="2" required
      placeholder="How you will know the outcome is reached"></textarea></label>
    {{end}}

    <label class="inline-label"><input type="checkbox" name="park" {{if $d.Vals.Get "park"}}checked{{end}}>
      park it — do not make it the next action <span class="hint">(only inside a project)</span></label>

    <details>
      <summary>more</summary>
      <div class="stack">
        <label>Context <input name="context" list="ctxlist" value="{{$d.Vals.Get "context"}}"
          placeholder="@home or @person(Andres)"></label>
        <label>Duration <select name="duration">
          <option value="">—</option>
          {{$dur := $d.Vals.Get "duration"}}
          <option {{if eq $dur "<5min"}}selected{{end}}>&lt;5min</option>
          <option {{if eq $dur "<15min"}}selected{{end}}>&lt;15min</option>
          <option {{if eq $dur "<1h"}}selected{{end}}>&lt;1h</option>
          <option {{if eq $dur ">1h"}}selected{{end}}>&gt;1h</option>
        </select></label>
        <label class="inline-label"><input type="checkbox" name="focus" {{if $d.Vals.Get "focus"}}checked{{end}}> needs focus</label>
        <label>Description <textarea name="description" rows="2">{{$d.Vals.Get "description"}}</textarea></label>
        <label>Tags <input name="tags" value="{{$d.Vals.Get "tags"}}" placeholder="#car #finance"></label>
        <label>Due date <input type="date" name="due" value="{{$d.Vals.Get "due"}}"></label>
        <label>Snooze until <input type="date" name="snooze" value="{{$d.Vals.Get "snooze"}}"></label>
      </div>
    </details>

    <div class="branches">
      <button class="primary">Create action</button>
      <a class="button" href="{{$d.Back}}">Back</a>
    </div>
  </form>
</div>
{{template "bottom" .}}
